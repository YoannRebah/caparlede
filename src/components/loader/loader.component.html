@if(isLoading && isFullScreen) {
    <div [id]="id" [class]="classNames" class="fixed top-0 left-0 w-full h-full bg-gray-700/60 z-50 flex items-center justify-center rounded-xl">
        <div class="loader loader-fullscreen">
            <div class="spinner spinner-base"></div>
        </div>
    </div>
}

@if(isLoading && !isFullScreen) {
    <div [id]="id" [class]="classNames" class="absolute top-0 left-0 w-full h-full bg-gray-700/40 z-10 flex items-center justify-center rounded-xl">
        <div class="loader loader-screen">
            <div class="spinner spinner-s"></div>
        </div>
    </div>
}
